[pytest]
markers =
    semantic: needs the real e5-large model (sentence-transformers + ~2.2 GB download)
filterwarnings =
    # Qdrant warns that payload indexes are no-ops in embedded mode. Expected,
    # and VectorIndex.describe() already reports it on every run.
    ignore::UserWarning
    # pymupdf's SWIG bindings on Python 3.11, raised at import time — not our
    # code and nothing actionable. Filtered narrowly by message so genuine
    # DeprecationWarnings from this package still surface.
    ignore:builtin type [Ss]wig.*:DeprecationWarning
